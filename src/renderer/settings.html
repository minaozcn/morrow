<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'">
  <title>Morrow Settings</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="widget settings">
    <header class="header settings-header">
      <h1 class="title settings-title">settings</h1>
      <button class="window-close" id="settings-close" type="button" aria-label="Close settings">×</button>
    </header>

    <div class="settings-list">
      <div class="settings-row">
        <span class="settings-label" id="label-startup">Launch on Windows Startup</span>
        <button class="switch" type="button" role="switch" aria-checked="false" aria-labelledby="label-startup" data-key="launchOnStartup" disabled></button>
      </div>
      <div class="settings-row">
        <span class="settings-label" id="label-ontop">Always on Top</span>
        <button class="switch" type="button" role="switch" aria-checked="false" aria-labelledby="label-ontop" data-key="alwaysOnTop" disabled></button>
      </div>
    </div>
  </main>

  <script src="js/settings.js"></script>
</body>
</html>
