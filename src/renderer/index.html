<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'">
  <title>Morrow</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="app" class="widget">
    <div class="flower" aria-hidden="true"></div>

    <header class="header">
      <h1 class="title">my little list <span class="title-heart" aria-hidden="true">♡</span></h1>
      <p class="date" id="date"></p>
      <button class="window-close" type="button" aria-label="Close">×</button>
    </header>

    <hr class="divider">

    <section class="task-area">
      <div class="task-area-content" id="task-area-content">
        <ul class="task-list" id="active-list"></ul>

        <div class="empty-state" id="empty-state" hidden>
          <div class="empty-flower" aria-hidden="true"></div>
          <p class="empty-text">Nothing to do yet!</p>
        </div>

        <label class="add-row">
          <span class="add-icon" aria-hidden="true">+</span>
          <input class="add-input" id="add-input" type="text" placeholder="Add a little task..." autocomplete="off">
        </label>

        <hr class="divider">

        <div class="completed">
          <button class="completed-toggle" id="completed-toggle" type="button" aria-expanded="false" aria-controls="completed-body">
            Completed <span class="completed-arrow" aria-hidden="true">▾</span>
          </button>
          <div class="completed-body" id="completed-body" hidden>
            <ul class="task-list" id="completed-list"></ul>
            <p class="completed-empty" id="completed-empty">No completed tasks yet</p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="js/priorities.js"></script>
  <script src="js/tasks.js"></script>
  <script src="js/interactions.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
